services:
  mibotica.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mibotica_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=mibotica_dbA12345$
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/vat/opt/mssql/data

volumes:
  mssql_data:
    
